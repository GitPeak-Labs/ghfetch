[workspace]
members = [".", "shared"]
resolver = "2"

[package]
name = "github-stats-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { path = "./shared" }
worker = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
