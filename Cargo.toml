[workspace]
resolver = "3"
members = ["crates/core", "crates/worker", "xtask"]
default-members = ["crates/core"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GitPeak-Labs/ghfetch"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
future_not_send = "allow"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
